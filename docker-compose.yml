# 单部署一键起(技术总纲 §1):前端静态构建由 nginx 提供,后端挂 SQLite 卷
services:
  backend:
    build: ./backend
    volumes:
      - bo-data:/app/data
    environment:
      # key 经设置页存库加密;亦可用 env 注入开发兜底
      - BO_LLM_API_KEY=${BO_LLM_API_KEY:-}
      - BO_EMBED_API_KEY=${BO_EMBED_API_KEY:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bo-data:
