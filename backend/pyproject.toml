[project]
name = "betteroneself"
version = "0.1.0"
description = "BetterOneself V0.1 backend——导入一本书 → 技能树骨架 → 学 → 测 → 点亮"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "cryptography>=43.0",
    "openai>=1.55",
    "httpx>=0.27",
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "sqlite-vec>=0.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",     # FastAPI Depends(...) 默认值是框架惯例
    "RUF001",   # 中文全角标点在本项目是正文，不是歧义字符
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "lxml", "lxml.etree"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
